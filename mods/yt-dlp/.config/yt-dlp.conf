-o '%(title)s [%(extractor)s %(id)s].%(ext)s'

# -sr is YouTube's AI-upscaled "super resolution" format; -vb is "AI voice-boosted"
# https://github.com/yt-dlp/yt-dlp/issues/15433
-f '(bv*[fps>30][format_id!*=-sr]/bv*[format_id!*=-sr])+ba[format_id!*=-vb]/(b[fps>30]/b)'

--merge-output-format mkv
--remux-video 'mov>mkv/mp4>mkv/webm>mkv/flv>mkv/aac>m4a/vorbis>ogg' # Opus should stay .opus, not .ogg!
--windows-filenames
--no-mtime
--convert-thumbnails 'webp>png'
--embed-thumbnail
--embed-chapters
--add-header Accept-Language:ja,en
